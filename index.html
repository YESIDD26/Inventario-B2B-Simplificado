<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Inventario</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #f1f5f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  </style>
</head>
<body class="min-h-screen text-slate-800 pb-12">

  <!-- Header Principal -->
  <header class="bg-[#2a2b72] text-white px-6 py-5 shadow-lg">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="p-2.5 bg-indigo-500/20 rounded-xl">
          <i class="fa-solid fa-cubes text-2xl text-indigo-300"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold tracking-tight">Dashboard de Inventario</h1>
          <p class="text-xs text-indigo-200">Monitoreo y análisis en tiempo real desde Google Sheets</p>
        </div>
      </div>
      
      <!-- Botón Actualizar Datos con animación de carga -->
      <button 
        onclick="refreshData()" 
        id="btnRefresh"
        class="bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 disabled:opacity-50 text-white font-semibold text-sm px-5 py-2.5 rounded-xl transition-all flex items-center gap-2 shadow-md hover:shadow-indigo-500/25 cursor-pointer disabled:cursor-not-allowed"
      >
        <i class="fa-solid fa-arrows-rotate" id="refreshIcon"></i>
        <span id="btnText">Actualizar Datos</span>
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 mt-6 space-y-6">

    <!-- Tarjetas de KPIs -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center gap-4">
        <div class="p-3.5 bg-indigo-50 text-indigo-600 rounded-xl">
          <i class="fa-solid fa-box text-xl"></i>
        </div>
        <div>
          <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">Total Unidades</span>
          <span class="text-2xl font-extrabold text-slate-800" id="kpiUnidades">0</span>
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center gap-4">
        <div class="p-3.5 bg-emerald-50 text-emerald-600 rounded-xl">
          <i class="fa-solid fa-list-check text-xl"></i>
        </div>
        <div>
          <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">Total Registros</span>
          <span class="text-2xl font-extrabold text-slate-800" id="kpiRegistros">0</span>
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center gap-4">
        <div class="p-3.5 bg-amber-50 text-amber-600 rounded-xl">
          <i class="fa-solid fa-warehouse text-xl"></i>
        </div>
        <div>
          <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">Sedes Autorizadas</span>
          <span class="text-2xl font-extrabold text-slate-800" id="kpiSedes">0</span>
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center gap-4">
        <div class="p-3.5 bg-purple-50 text-purple-600 rounded-xl">
          <i class="fa-solid fa-tags text-xl"></i>
        </div>
        <div>
          <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">Marcas Registradas</span>
          <span class="text-2xl font-extrabold text-slate-800" id="kpiMarcas">0</span>
        </div>
      </div>
    </div>

    <!-- Filtros de Inventario -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
      <div class="flex flex-wrap justify-between items-center mb-4 gap-3">
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-2 text-slate-700 font-bold text-base">
            <i class="fa-solid fa-filter text-indigo-600"></i>
            <span>Filtros de Inventario</span>
          </div>

          <!-- Botón de Activación B2B -->
          <button 
            id="btnB2B" 
            onclick="toggleFiltroB2B()" 
            class="ml-2 px-3.5 py-1.5 rounded-xl font-bold text-xs transition-all flex items-center gap-2 border border-slate-300 bg-slate-100 text-slate-600 hover:bg-slate-200 cursor-pointer shadow-sm"
          >
            <i class="fa-solid fa-bolt text-slate-400" id="b2bIcon"></i>
            <span>Filtro B2B</span>
            <span id="b2bBadge" class="ml-1 px-1.5 py-0.5 rounded-full text-[9px] bg-slate-300 text-slate-700 font-extrabold">OFF</span>
          </button>
        </div>

        <button onclick="clearFilters()" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 cursor-pointer">Limpiar Filtros</button>
      </div>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Sede</label>
          <select id="selectBodega" onchange="applyFilters()" class="w-full bg-slate-50 border border-slate-300 text-slate-700 text-sm rounded-xl p-2.5 focus:ring-2 focus:ring-indigo-500">
            <option value="">Todas las Sedes Autorizadas</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font
